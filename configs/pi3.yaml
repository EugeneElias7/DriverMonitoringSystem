# Raspberry Pi 3 / 64-bit Raspberry Pi OS overrides (provisional, not hardware-tested).
# This profile trades temporal resolution for CPU/RAM headroom. It does NOT claim
# real-time operation. Measure on the target before deployment.
face:
  mode: video
  num_faces: 1
  auto_roi_retry: false
  roi_min_side: 384
  min_detection_confidence: 0.45
  smoothing_alpha: 0.55

pipeline:
  process_every_n_frames: 1
  resize_width: 640
  save_annotated: false
  save_events_jsonl: true

smoking:
  backend: yolo_onnx
  input_size: 640
  confidence_threshold: 0.30
  # Skipping inference frames increases miss risk; stale results are bounded.
  inference_interval: 5
  stale_after_ms: 600
  confirmation_ms: 1500
  miss_tolerance_ms: 1200

drowsiness:
  perclos_window_ms: 60000
  event_cooldown_ms: 5000

distraction:
  event_cooldown_ms: 5000

video:
  fps_fallback: 15.0
